[package]
name = "ariel-os-matter-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Chip-independent no_std Matter subsystem API for Ariel OS"

[features]
default = [
    "commissioning",
    "events",
    "factory-reset",
    "persistent-subscriptions",
    "storage",
]
std = []
defmt = []
commissioning = []
events = []
factory-reset = []
persistent-subscriptions = []
storage = []
groups = []

wifi = []
ethernet = []
thread = []
ble = []
ota-requestor = []
ota-provider = []
bridge = []

devices-lighting = []
devices-switches = []
devices-locks = []
devices-sensors = []
devices-closures = []
devices-hvac = []
devices-water = []
devices-energy = []
devices-appliances = []
devices-media = []
devices-infrastructure = []
esp32-s3 = []

all-device-types = [
    "devices-lighting",
    "devices-switches",
    "devices-locks",
    "devices-sensors",
    "devices-closures",
    "devices-hvac",
    "devices-water",
    "devices-energy",
    "devices-appliances",
    "devices-media",
    "devices-infrastructure",
    "bridge",
    "ota-requestor",
    "ota-provider",
]

# Compatibility aliases for the first implementation branch.
service-ble = ["ble"]
service-bridge = ["bridge"]
service-ethernet = ["ethernet"]
service-ota-provider = ["ota-provider"]
service-ota-requestor = ["ota-requestor"]
service-thread = ["thread"]
service-wifi = ["wifi"]
device-foundation = ["devices-infrastructure"]
device-lighting = ["devices-lighting"]
device-switches = ["devices-switches"]
device-sensors = ["devices-sensors"]
device-locks-closures = ["devices-locks", "devices-closures"]
device-hvac = ["devices-hvac"]
device-water = ["devices-water"]
device-energy = ["devices-energy"]
device-appliances = ["devices-appliances"]
device-media = ["devices-media"]
device-bridges = ["bridge"]
device-thread-infrastructure = ["devices-infrastructure"]
device-ota = ["ota-requestor", "ota-provider"]

[dependencies]
bitflags.workspace = true
heapless.workspace = true

[lints]
workspace = true
