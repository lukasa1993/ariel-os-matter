[workspace]
resolver = "3"
members = [
    "crates/ariel-os-matter-core",
    "crates/ariel-os-matter-rs",
    "crates/ariel-os-matter-ariel",
    "platforms/esp32-s3",
    "tools/support-matrix",
]
default-members = [
    "crates/ariel-os-matter-core",
    "crates/ariel-os-matter-rs",
    "tools/support-matrix",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lukasa1993/ariel-os-matter"

[workspace.dependencies]
bitflags = { version = "2.9", default-features = false }
heapless = { version = "0.9.1", default-features = false }
rs-matter = { git = "https://github.com/project-chip/rs-matter", rev = "63a544f0286e0c8d2a8c2ed9a4cf05f68d5c9876", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(context, values(\"ariel-os\", \"esp\"))"] }

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[patch.crates-io]
# Ariel OS compatibility patches from ariel-os-cargo.toml at
# 90f41cfe52c86c96b09b276b44e1a40e14733058. Cargo does not inherit
# dependency-local patches, so the top-level workspace must repeat them.
