name: format-source

on:
  push:
    branches:
      - fix/static-audit-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt

      - name: Format source
        run: cargo fmt --all

      - name: Export format patch
        run: git diff --binary > rustfmt.patch

      - name: Export formatted source
        run: tar --exclude=.git --exclude=formatted-source.tar -cf formatted-source.tar .

      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: formatted-source
          path: |
            rustfmt.patch
            formatted-source.tar
          if-no-files-found: error
          retention-days: 7
