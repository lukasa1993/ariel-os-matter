name: static-audit

on:
  push:
    branches:
      - fix/static-audit-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archive audited source
        run: git archive --format=tar HEAD > source.tar

      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Record tool versions
        run: |
          rustc --version --verbose
          cargo --version --verbose
          python3 --version
          git --version

      - name: Resolve pinned dependencies
        run: cargo generate-lockfile

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check portable core without defaults
        run: cargo check -p ariel-os-matter-core --no-default-features

      - name: Check workspace targets
        run: cargo check --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-audit-evidence
          path: |
            source.tar
            Cargo.lock
          if-no-files-found: warn
          retention-days: 7
